name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Gradle 9.2.0
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.2.0-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME/gradle"
      - name: Build
        run: $HOME/gradle/gradle-9.2.0/bin/gradle build --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: drop-all-jar
          path: build/libs/*.jar
